<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CBZ Reader Local</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e8eaf0; --muted: #9aa3b2;
      --accent: #5aa9ff; --border: #2a3140; --shadow: rgba(0,0,0,.35);
      --reader-bg: #111318; --page-bg: #ffffff;
      --thumb-w: 112px; --topbar-h: 62px; --scroll-scale: 1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y;
    }
    body.mobile { --reader-bg: #0b0d12; }
    body.pc     { --reader-bg: #131722; }
    .app {
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
      width: 100%; position: relative; overflow: hidden;
    }
    .topbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px; background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      z-index: 30; min-height: var(--topbar-h);
      position: sticky; top: 0; flex-shrink: 0;
    }
    .topbar .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── Go-to-page input group ── */
    .goto-group {
      display: flex; gap: 4px; align-items: center;
    }
    .goto-group input[type="number"] {
      width: 64px; padding: 9px 8px; font-size: 14px;
      background: #202635; color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      -moz-appearance: textfield; text-align: center;
    }
    .goto-group input[type="number"]::-webkit-inner-spin-button,
    .goto-group input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .goto-group input[type="number"]:focus {
      outline: none; border-color: var(--accent);
    }
    .goto-group button { min-width: 46px; }
    .goto-group .page-total { color: var(--muted); font-size: 13px; white-space: nowrap; }

    button, input[type="file"] {
      background: #202635; color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font-size: 14px;
      touch-action: manipulation;
    }
    button { cursor: pointer; }
    button.active { background: var(--accent); color: #05101c; border-color: transparent; font-weight: 700; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      color: var(--muted); font-size: 13px; margin-left: auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 44vw;
    }

    /* ── Resume toast ── */
    #resumeToast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1e2a3a; color: var(--text);
      border: 1px solid var(--accent); border-radius: 14px;
      padding: 12px 20px; font-size: 14px; z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      display: flex; gap: 12px; align-items: center;
      opacity: 0; transition: opacity .25s ease;
      pointer-events: none;
    }
    #resumeToast.show { opacity: 1; pointer-events: auto; }
    #resumeToast button {
      padding: 6px 14px; font-size: 13px; border-radius: 8px;
    }
    #resumeToast .toast-dismiss {
      background: transparent; border-color: var(--border); color: var(--muted);
    }

    .dropzone {
      margin: 10px; padding: 16px;
      border: 2px dashed var(--border); border-radius: 16px;
      background: rgba(255,255,255,.02);
      color: var(--muted); text-align: center; user-select: none; flex-shrink: 0;
    }
    .dropzone.dragover { border-color: var(--accent); color: var(--text); background: rgba(90,169,255,.08); }
    .reader {
      flex: 1; overflow: auto; min-height: 0;
      background: var(--reader-bg); position: relative;
      overscroll-behavior: none; -webkit-overflow-scrolling: touch;
      overflow-anchor: none; touch-action: pan-x pan-y;
    }
    .scroll-view {
      width: 100%; display: flex; flex-direction: column; align-items: center;
      gap: 0; padding: 0; margin: 0; overflow-anchor: none;
    }
    .scroll-page {
      width: calc(100% * var(--scroll-scale));
      display: block; line-height: 0; margin: 0 auto; padding: 0; overflow: hidden;
    }
    .scroll-page img {
      display: block; width: 100%; height: auto;
      margin: 0 auto; border: none; border-radius: 0; box-shadow: none;
      background: #fff; user-select: none; -webkit-user-drag: none; pointer-events: none;
    }
    /* PDF loading progress bar */
    .pdf-progress {
      position: sticky; top: 0; z-index: 5;
      width: 100%; height: 3px; background: var(--border);
    }
    .pdf-progress-bar {
      height: 100%; background: var(--accent);
      transition: width .2s ease; width: 0%;
    }
    .pdf-progress.done { display: none; }

    /* Invert */
    body.inverted .scroll-page img,
    body.inverted .page img,
    body.inverted .single-page img { filter: invert(1); }
    body.inverted .page { background: #000; }

    .book-shell { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
    .book {
      position: relative; width: min(92vw, 1200px); height: min(88vh, 900px);
      display: flex; justify-content: center; align-items: center;
    }
    .spread {
      position: relative; width: 100%; height: 100%;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .page {
      position: relative; background: var(--page-bg);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 12px 40px var(--shadow);
      display: flex; align-items: center; justify-content: center;
    }
    .page img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      background: #fff; user-select: none; -webkit-user-drag: none; pointer-events: none;
    }
    .single-page { width: 100%; height: 100%; display: none; }
    .single-page img {
      width: 100%; height: 100%; object-fit: contain; background: #fff;
      box-shadow: 0 12px 40px var(--shadow); border-radius: 12px;
      user-select: none; -webkit-user-drag: none; pointer-events: none;
    }
    .nav-bottom {
      position: absolute; left: 0; right: 0; bottom: 12px;
      display: flex; justify-content: center; gap: 10px;
      pointer-events: none; z-index: 12;
    }
    .nav-bottom .navbtn { pointer-events: auto; backdrop-filter: blur(8px); }
    .page-counter {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,.55); color: white;
      padding: 8px 10px; border-radius: 999px;
      font-size: 13px; z-index: 13; pointer-events: none;
    }
    .hidden { display: none !important; }
    .thumb-panel {
      position: fixed; top: var(--topbar-h); right: 0;
      width: var(--thumb-w);
      height: calc(100vh - var(--topbar-h)); height: calc(100dvh - var(--topbar-h));
      background: rgba(12,14,20,.96); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform .18s ease;
      z-index: 28; overflow-y: auto; overscroll-behavior: contain;
      touch-action: pan-y; padding: 8px; box-shadow: -8px 0 24px rgba(0,0,0,.22);
    }
    body.fullscreen-reading .thumb-panel { top: 0; height: 100vh; height: 100dvh; }
    body.thumbs-open .thumb-panel { transform: translateX(0); }
    .thumb-item {
      width: 100%; padding: 0; border: 2px solid transparent;
      border-radius: 10px; overflow: hidden; margin-bottom: 8px;
      background: #1b2130; line-height: 0;
    }
    .thumb-item.active { border-color: var(--accent); }
    .thumb-item img {
      width: 100%; display: block; object-fit: cover; aspect-ratio: 3/4;
      background: #fff; user-select: none; -webkit-user-drag: none; pointer-events: none;
    }
    .fullscreen-tools {
      position: fixed; right: 12px; bottom: 12px;
      display: none; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 40;
    }
    body.fullscreen-reading .fullscreen-tools { display: flex; }
    :fullscreen .topbar, body.fullscreen-reading .topbar { display: none !important; }
    :fullscreen .dropzone, body.fullscreen-reading .dropzone { display: none !important; }
    :fullscreen .reader, body.fullscreen-reading .reader { height: 100vh !important; height: 100dvh !important; }
    body.fullscreen-reading .app { height: 100vh; height: 100dvh; }
    body.mobile .book {
      width: min(100vw, 100%);
      height: calc(100vh - var(--topbar-h)); height: calc(100dvh - var(--topbar-h));
    }
    body.fullscreen-reading .book { width: 100vw; height: 100vh; height: 100dvh; }
    body.mobile.portrait .spread { display: none; }
    body.mobile.portrait .single-page { display: block; }
    body.mobile.landscape .spread { display: grid; }
    body.mobile.landscape .single-page { display: none; }
    body.pc .spread { display: grid; }
    body.pc .single-page { display: none; }
    body.pc .book { width: min(96vw, 1400px); height: min(90vh, 980px); }
    @media (max-width: 900px) { .status { max-width: 100%; margin-left: 0; } }
    @media (max-width: 700px) {
      :root { --thumb-w: 96px; }
      .topbar { gap: 6px; }
      button, input[type="file"] { padding: 9px 10px; font-size: 13px; }
      .goto-group input[type="number"] { width: 52px; }
    }
  </style>
</head>

<body class="mobile portrait">
  <div class="app">
    <div class="topbar">
      <div class="group">
        <input id="fileInput" type="file" multiple />
        <button id="openFileBtn">Open</button>
        <button id="btnMobile" class="active">Mobile</button>
        <button id="btnPc">PC</button>
        <button id="btnScroll" class="active">Scroll</button>
        <button id="btnBook">Book</button>
        <button id="thumbToggleBtn">Thumbs</button>
        <button id="zoomOutBtn">－</button>
        <button id="zoomResetBtn">100%</button>
        <button id="zoomInBtn">＋</button>
        <button id="invertBtn">☀︎</button>
        <button id="fullscreenBtn">Fullscreen</button>
      </div>
      <div class="group">
        <button id="prevBtn" disabled>Prev</button>
        <button id="nextBtn" disabled>Next</button>
        <button id="firstBtn" disabled>First</button>
        <button id="lastBtn" disabled>Last</button>
      </div>
      <!-- ── Go-to-page ── -->
      <div class="goto-group">
        <input id="gotoInput" type="number" min="1" placeholder="หน้า" disabled title="กรอกเลขหน้าแล้วกด Enter หรือ Go" />
        <button id="gotoBtn" disabled>Go</button>
        <span class="page-total" id="gotoTotal">/ 0</span>
      </div>
      <div class="status" id="status">เลือกไฟล์ CBZ / ZIP / PDF หรือรูปภาพ</div>
    </div>

    <div id="dropzone" class="dropzone">ลากไฟล์ .cbz, .zip, .pdf หรือรูปภาพมาวางตรงนี้</div>

    <div id="reader" class="reader scroll">
      <!-- PDF progress bar -->
      <div id="pdfProgressWrap" class="pdf-progress done">
        <div id="pdfProgressBar" class="pdf-progress-bar"></div>
      </div>

      <div id="scrollView" class="scroll-view hidden"></div>

      <div id="bookShell" class="book-shell hidden">
        <div class="book">
          <div class="page-counter" id="pageCounter">0 / 0</div>
          <div class="spread">
            <div class="page"><img id="leftPage" alt="left page"></div>
            <div class="page"><img id="rightPage" alt="right page"></div>
          </div>
          <div class="single-page"><img id="singlePage" alt="single page"></div>
          <div class="nav-bottom">
            <button class="navbtn" id="bookPrev">◀</button>
            <button class="navbtn" id="bookNext">▶</button>
          </div>
        </div>
      </div>
    </div>

    <div id="thumbPanel" class="thumb-panel hidden"></div>

    <div class="fullscreen-tools">
      <button id="fsThumbBtn">Thumbs</button>
      <button id="fsZoomOutBtn">－</button>
      <button id="fsZoomResetBtn">100%</button>
      <button id="fsZoomInBtn">＋</button>
      <button id="fsInvertBtn">☀︎</button>
      <button id="fsExitBtn">Exit</button>
    </div>
  </div>

  <!-- ── Resume toast ── -->
  <div id="resumeToast">
    <span id="resumeMsg">อ่านค้างไว้ที่หน้า <strong id="resumePageNum">?</strong></span>
    <button id="resumeGoBtn">ไปหน้านั้น</button>
    <button class="toast-dismiss" id="resumeDismissBtn">ข้าม</button>
  </div>

  <script>
    /* ── PDF.js worker ───────────────────────────────────────────────── */
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }

    /* ── DOM refs ────────────────────────────────────────────────────── */
    const fileInput       = document.getElementById('fileInput');
    const openFileBtn     = document.getElementById('openFileBtn');
    const dropzone        = document.getElementById('dropzone');
    const reader          = document.getElementById('reader');
    const scrollView      = document.getElementById('scrollView');
    const bookShell       = document.getElementById('bookShell');
    const statusEl        = document.getElementById('status');
    const btnMobile       = document.getElementById('btnMobile');
    const btnPc           = document.getElementById('btnPc');
    const btnScroll       = document.getElementById('btnScroll');
    const btnBook         = document.getElementById('btnBook');
    const thumbToggleBtn  = document.getElementById('thumbToggleBtn');
    const zoomOutBtn      = document.getElementById('zoomOutBtn');
    const zoomResetBtn    = document.getElementById('zoomResetBtn');
    const zoomInBtn       = document.getElementById('zoomInBtn');
    const invertBtn       = document.getElementById('invertBtn');
    const fullscreenBtn   = document.getElementById('fullscreenBtn');
    const fsThumbBtn      = document.getElementById('fsThumbBtn');
    const fsZoomOutBtn    = document.getElementById('fsZoomOutBtn');
    const fsZoomResetBtn  = document.getElementById('fsZoomResetBtn');
    const fsZoomInBtn     = document.getElementById('fsZoomInBtn');
    const fsInvertBtn     = document.getElementById('fsInvertBtn');
    const fsExitBtn       = document.getElementById('fsExitBtn');
    const prevBtn         = document.getElementById('prevBtn');
    const nextBtn         = document.getElementById('nextBtn');
    const firstBtn        = document.getElementById('firstBtn');
    const lastBtn         = document.getElementById('lastBtn');
    const bookPrev        = document.getElementById('bookPrev');
    const bookNext        = document.getElementById('bookNext');
    const leftPage        = document.getElementById('leftPage');
    const rightPage       = document.getElementById('rightPage');
    const singlePage      = document.getElementById('singlePage');
    const pageCounter     = document.getElementById('pageCounter');
    const thumbPanel      = document.getElementById('thumbPanel');
    const pdfProgressWrap = document.getElementById('pdfProgressWrap');
    const pdfProgressBar  = document.getElementById('pdfProgressBar');
    // Go-to-page
    const gotoInput       = document.getElementById('gotoInput');
    const gotoBtn         = document.getElementById('gotoBtn');
    const gotoTotal       = document.getElementById('gotoTotal');
    // Resume toast
    const resumeToast     = document.getElementById('resumeToast');
    const resumeMsg       = document.getElementById('resumeMsg');
    const resumePageNum   = document.getElementById('resumePageNum');
    const resumeGoBtn     = document.getElementById('resumeGoBtn');
    const resumeDismissBtn= document.getElementById('resumeDismissBtn');

    /* ── State ───────────────────────────────────────────────────────── */
    let pages        = [];
    let currentIndex = 0;
    let theme        = localStorage.getItem('cbz_theme')  || 'mobile';
    let mode         = localStorage.getItem('cbz_mode')   || 'scroll';
    let thumbsOpen   = localStorage.getItem('cbz_thumbs');
    let pageZoom     = Number(localStorage.getItem('cbz_page_zoom') || '1');
    let invertColors = localStorage.getItem('cbz_invert') === '1';
    let busy         = false;
    let pdfLoading   = false;
    let currentFileName = ''; // ชื่อไฟล์ที่เปิดอยู่

    if (thumbsOpen === null) thumbsOpen = (theme === 'pc') ? '1' : '0';
    thumbsOpen = thumbsOpen === '1';

    /* ── Last-position memory ────────────────────────────────────────── */
    const HISTORY_KEY = 'cbz_history'; // { [fileName]: pageIndex }

    function saveLastPosition() {
      if (!currentFileName || !pages.length) return;
      try {
        const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
        h[currentFileName] = currentIndex;
        // จำแค่ 50 ไฟล์ล่าสุด เพื่อไม่ให้ localStorage เต็ม
        const keys = Object.keys(h);
        if (keys.length > 50) delete h[keys[0]];
        localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
      } catch (e) {}
    }

    function getLastPosition(fileName) {
      try {
        const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
        return (fileName in h) ? Number(h[fileName]) : -1;
      } catch { return -1; }
    }

    /* ── Resume toast ────────────────────────────────────────────────── */
    let _resumeTarget = -1;
    let _toastTimer   = null;

    function showResumeToast(pageIndex) {
      _resumeTarget = pageIndex;
      resumePageNum.textContent = pageIndex + 1;
      resumeToast.classList.add('show');
      // ซ่อนอัตโนมัติหลัง 8 วินาที
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(hideResumeToast, 8000);
    }
    function hideResumeToast() {
      resumeToast.classList.remove('show');
      clearTimeout(_toastTimer);
    }
    resumeGoBtn.addEventListener('click', () => {
      if (_resumeTarget >= 0 && _resumeTarget < pages.length) {
        currentIndex = _resumeTarget;
        updateView(); syncScrollToCurrent();
      }
      hideResumeToast();
    });
    resumeDismissBtn.addEventListener('click', hideResumeToast);

    /* ── Go-to-page ──────────────────────────────────────────────────── */
    function gotoPage() {
      const n = parseInt(gotoInput.value, 10);
      if (isNaN(n) || !pages.length) return;
      const idx = clamp(n - 1, 0, pages.length - 1);
      currentIndex = idx;
      if (mode === 'book' && isSpreadView()) normalizeSpreadIndex();
      updateView(); syncScrollToCurrent();
      gotoInput.blur();
    }
    gotoBtn.addEventListener('click', gotoPage);
    gotoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') gotoPage(); });

    function updateGotoUI() {
      const has = pages.length > 0;
      gotoInput.disabled = !has;
      gotoBtn.disabled   = !has;
      gotoInput.max      = pages.length || 1;
      gotoTotal.textContent = `/ ${pages.length}`;
    }

    /* ── Pinch-to-zoom ───────────────────────────────────────────────── */
    let pinchActive = false, pinchDist0 = 0, pinchZoom0 = 1;
    let pinchMidX = 0, pinchMidY = 0, pinchScrollX0 = 0, pinchScrollY0 = 0;

    function ptDist(t1, t2) {
      return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    }
    function initPinch(touches) {
      pinchActive   = true;
      pinchDist0    = ptDist(touches[0], touches[1]);
      pinchZoom0    = pageZoom;
      pinchMidX     = (touches[0].clientX + touches[1].clientX) / 2;
      pinchMidY     = (touches[0].clientY + touches[1].clientY) / 2;
      pinchScrollX0 = reader.scrollLeft;
      pinchScrollY0 = reader.scrollTop;
    }
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) initPinch(e.touches);
      if (e.touches.length > 2)  pinchActive = false;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (!pinchActive || e.touches.length < 2) return;
      e.preventDefault();
      const d = ptDist(e.touches[0], e.touches[1]);
      if (pinchDist0 < 1) return;
      const nz = clamp(pinchZoom0 * (d / pinchDist0), 0.25, 4);
      pageZoom = nz; applyPageZoom();
      const nH = reader.scrollHeight, nW = reader.scrollWidth;
      const cH = reader.clientHeight, cW = reader.clientWidth;
      const r  = nz / pinchZoom0;
      reader.scrollLeft = clamp((pinchScrollX0 + pinchMidX) * r - pinchMidX, 0, Math.max(0, nW - cW));
      reader.scrollTop  = clamp((pinchScrollY0 + pinchMidY) * r - pinchMidY, 0, Math.max(0, nH - cH));
    }, { passive: false });
    document.addEventListener('touchend',    (e) => { if (e.touches.length < 2) pinchActive = false; }, { passive: true });
    document.addEventListener('touchcancel', ()  => { pinchActive = false; },                           { passive: true });

    /* ── Scroll → update currentIndex ───────────────────────────────── */
    let scrollSaveTimer = null;
    reader.addEventListener('scroll', () => {
      if (mode !== 'scroll' || !pages.length) return;
      // หา index ของหน้าที่กำลังแสดงอยู่
      const children = scrollView.children;
      const mid = reader.scrollTop + reader.clientHeight / 2;
      let best = 0, bestDist = Infinity;
      for (let i = 0; i < children.length; i++) {
        const el = children[i];
        const dist = Math.abs(el.offsetTop + el.offsetHeight / 2 - mid);
        if (dist < bestDist) { bestDist = dist; best = i; }
      }
      if (best !== currentIndex) {
        currentIndex = best;
        updateThumbActive();
        updateButtons();
      }
      // บันทึกตำแหน่งแบบ debounce
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(saveLastPosition, 600);
    }, { passive: true });

    /* ── Helpers ─────────────────────────────────────────────────────── */
    function isIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function setStatus(msg) { statusEl.textContent = msg; }
    function isImageFile(n) { return /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(n); }
    function isZipFile(n)   { return /\.(cbz|zip)$/i.test(n); }
    function isPdfFile(n)   { return /\.pdf$/i.test(n); }
    function naturalSort(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    }

    function updateOrientationState() {
      const portrait = window.matchMedia('(orientation: portrait)').matches || window.innerHeight >= window.innerWidth;
      document.body.classList.toggle('portrait',  portrait);
      document.body.classList.toggle('landscape', !portrait);
    }
    function isSpreadView() {
      return mode === 'book' && (theme === 'pc' || document.body.classList.contains('landscape'));
    }
    function getBookStep() { return isSpreadView() ? 2 : 1; }
    function getMaxStartIndex() {
      if (!pages.length) return 0;
      if (!isSpreadView()) return pages.length - 1;
      if (pages.length <= 1) return 0;
      return (pages.length % 2 === 0) ? pages.length - 2 : pages.length - 1;
    }
    function normalizeSpreadIndex() {
      if (!isSpreadView()) return;
      if (currentIndex % 2 === 1) currentIndex -= 1;
      currentIndex = clamp(currentIndex, 0, getMaxStartIndex());
    }

    /* ── Zoom ────────────────────────────────────────────────────────── */
    function applyPageZoom() {
      pageZoom = clamp(pageZoom, 0.25, 4);
      document.documentElement.style.setProperty('--scroll-scale', pageZoom);
      localStorage.setItem('cbz_page_zoom', String(pageZoom));
      const pct = Math.round(pageZoom * 100);
      zoomResetBtn.textContent = fsZoomResetBtn.textContent = `${pct}%`;
    }
    function setPageZoom(z) {
      const nz = clamp(Number(z) || 1, 0.25, 4);
      if (Math.abs(nz - pageZoom) < 0.0001) return;
      const r = nz / pageZoom;
      const sT = reader.scrollTop, sL = reader.scrollLeft;
      const cH = reader.clientHeight, cW = reader.clientWidth;
      pageZoom = nz; applyPageZoom();
      const nH = reader.scrollHeight, nW = reader.scrollWidth;
      reader.scrollTop  = clamp((sT + cH / 2) * r - cH / 2, 0, Math.max(0, nH - cH));
      reader.scrollLeft = clamp((sL + cW / 2) * r - cW / 2, 0, Math.max(0, nW - cW));
    }
    function zoomIn()    { setPageZoom(pageZoom + 0.1); }
    function zoomOut()   { setPageZoom(pageZoom - 0.1); }
    function resetZoom() { setPageZoom(1); }

    /* ── Invert ──────────────────────────────────────────────────────── */
    function applyInvert() {
      document.body.classList.toggle('inverted', invertColors);
      invertBtn.classList.toggle('active',   invertColors);
      fsInvertBtn.classList.toggle('active', invertColors);
    }
    function toggleInvert() {
      invertColors = !invertColors;
      localStorage.setItem('cbz_invert', invertColors ? '1' : '0');
      applyInvert();
    }

    /* ── Theme / Mode / Thumbs ───────────────────────────────────────── */
    function setTheme(t) {
      theme = t; localStorage.setItem('cbz_theme', t);
      document.body.classList.toggle('mobile', t === 'mobile');
      document.body.classList.toggle('pc',     t === 'pc');
      btnMobile.classList.toggle('active', t === 'mobile');
      btnPc.classList.toggle('active',     t === 'pc');
      if (t === 'pc') setThumbsOpen(true);
      updateView();
    }
    function setMode(m) {
      mode = m; localStorage.setItem('cbz_mode', m);
      btnScroll.classList.toggle('active', m === 'scroll');
      btnBook.classList.toggle('active',   m === 'book');
      updateView();
    }
    function setThumbsOpen(open) {
      thumbsOpen = !!open; localStorage.setItem('cbz_thumbs', thumbsOpen ? '1' : '0');
      document.body.classList.toggle('thumbs-open', thumbsOpen);
      thumbPanel.classList.toggle('hidden', !thumbsOpen);
      thumbToggleBtn.classList.toggle('active', thumbsOpen);
      fsThumbBtn.classList.toggle('active',     thumbsOpen);
    }
    function toggleThumbs() { setThumbsOpen(!thumbsOpen); }

    /* ── Clear ───────────────────────────────────────────────────────── */
    function clearPages() {
      for (const p of pages) { try { URL.revokeObjectURL(p.url); } catch {} }
      pages = []; currentIndex = 0; currentFileName = '';
      scrollView.innerHTML = ''; thumbPanel.innerHTML = '';
      leftPage.src = ''; rightPage.src = ''; singlePage.src = '';
      pageCounter.textContent = '0 / 0';
      prevBtn.disabled = nextBtn.disabled = firstBtn.disabled =
        lastBtn.disabled = bookPrev.disabled = bookNext.disabled = true;
      dropzone.classList.remove('hidden');
      pdfProgressWrap.classList.add('done');
      pdfProgressBar.style.width = '0%';
      pageZoom = 1; applyPageZoom();
      updateGotoUI();
      hideResumeToast();
    }

    /* ── After load: check history ───────────────────────────────────── */
    function afterLoad(fileName) {
      currentFileName = fileName;
      updateGotoUI();
      const last = getLastPosition(fileName);
      if (last > 0 && last < pages.length) {
        // มีประวัติ → แสดง toast
        showResumeToast(last);
      }
    }

    /* ── Loaders ─────────────────────────────────────────────────────── */
    async function loadImageFiles(fileList) {
      clearPages();
      setStatus('กำลังอ่านรูปภาพ...');
      const files = [...fileList]
        .filter(f => isImageFile(f.name))
        .sort((a, b) => naturalSort(a.name, b.name));
      if (!files.length) { setStatus('ไม่พบรูปภาพ'); return; }
      for (const f of files) pages.push({ name: f.name, url: URL.createObjectURL(f) });
      currentIndex = 0;
      setStatus(`โหลดแล้ว ${pages.length} หน้า`);
      renderThumbs(); updateView();
      afterLoad(files.map(f => f.name).join('|'));
    }

    async function loadCbz(file) {
      if (!window.JSZip) { alert('JSZip โหลดไม่สำเร็จ'); return; }
      clearPages(); setStatus('กำลังอ่านไฟล์...');
      const zip = await JSZip.loadAsync(file);
      const entries = [];
      zip.forEach((_, e) => { if (!e.dir && isImageFile(e.name)) entries.push(e.name); });
      entries.sort(naturalSort);
      if (!entries.length) { setStatus('ไม่พบรูปในไฟล์ CBZ'); return; }
      for (const name of entries) {
        const blob = await zip.file(name).async('blob');
        pages.push({ name, url: URL.createObjectURL(blob) });
      }
      currentIndex = 0;
      setStatus(`โหลดแล้ว ${pages.length} หน้า`);
      renderThumbs(); updateView();
      afterLoad(file.name);
    }

    /* ── PDF Loader ──────────────────────────────────────────────────── */
    async function loadPdf(file) {
      if (typeof pdfjsLib === 'undefined') {
        setStatus('PDF.js โหลดไม่สำเร็จ — ตรวจสอบอินเตอร์เน็ต'); return;
      }
      if (pdfLoading) return;
      pdfLoading = true;
      clearPages();
      setStatus('กำลังเปิด PDF...');

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const total = pdf.numPages;

        pdfProgressWrap.classList.remove('done');

        const dpr        = Math.min(window.devicePixelRatio || 1, 2);
        const targetPx   = Math.min(960, (window.screen.width || 390)) * dpr;
        const baseName   = file.name.replace(/\.pdf$/i, '');

        for (let i = 1; i <= total; i++) {
          const pct = Math.round((i - 1) / total * 100);
          pdfProgressBar.style.width = pct + '%';
          setStatus(`PDF: แปลงหน้า ${i} / ${total}`);

          const page      = await pdf.getPage(i);
          const natural   = page.getViewport({ scale: 1 });
          const scale     = targetPx / natural.width;
          const viewport  = page.getViewport({ scale });

          const canvas    = document.createElement('canvas');
          canvas.width    = Math.round(viewport.width);
          canvas.height   = Math.round(viewport.height);

          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({ canvasContext: ctx, viewport }).promise;

          const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
          pages.push({
            name: `${baseName} p${String(i).padStart(3, '0')}`,
            url: URL.createObjectURL(blob)
          });

          if (i === 1 || i % 10 === 0 || i === total) {
            renderThumbs(); updateView(); updateGotoUI();
          }
        }

        pdfProgressBar.style.width = '100%';
        setTimeout(() => pdfProgressWrap.classList.add('done'), 400);

        currentIndex = 0;
        setStatus(`PDF: ${total} หน้า`);
        renderThumbs(); updateView();
        afterLoad(file.name);

      } catch (err) {
        console.error(err);
        clearPages();
        setStatus('เปิด PDF ไม่สำเร็จ: ' + (err?.message || err));
      } finally {
        pdfLoading = false;
      }
    }

    async function loadSelectedFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;
      const first = files[0];
      try {
        if (files.length === 1 && isPdfFile(first.name)) {
          await loadPdf(first);
        } else if (files.length > 1 || isImageFile(first.name)) {
          await loadImageFiles(files);
        } else if (isZipFile(first.name)) {
          await loadCbz(first);
        } else if (isPdfFile(first.name)) {
          await loadPdf(first);
        } else {
          setStatus('รองรับ .cbz, .zip, .pdf และไฟล์รูปภาพ');
        }
      } catch (err) {
        console.error(err);
        clearPages();
        setStatus('เปิดไฟล์ไม่สำเร็จ: ' + (err?.message || err));
      }
    }

    /* ── Render ──────────────────────────────────────────────────────── */
    function updateButtons() {
      const has  = pages.length > 0;
      const last = getMaxStartIndex();
      prevBtn.disabled  = firstBtn.disabled  = bookPrev.disabled = !has || currentIndex <= 0;
      nextBtn.disabled  = lastBtn.disabled   = bookNext.disabled = !has || currentIndex >= last;
    }

    function makeScrollPage(i) {
      const wrap = document.createElement('div');
      wrap.className = 'scroll-page';
      const img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async';
      img.src = pages[i].url; img.alt = pages[i].name;
      wrap.appendChild(img);
      return wrap;
    }

    function renderScroll() {
      const existing = scrollView.childElementCount;
      const total    = pages.length;

      if (existing < total) {
        for (let i = existing; i < total; i++) {
          scrollView.appendChild(makeScrollPage(i));
        }
      } else if (existing > total) {
        const savedTop  = reader.scrollTop;
        const prevH     = reader.scrollHeight;
        scrollView.innerHTML = '';
        for (let i = 0; i < total; i++) scrollView.appendChild(makeScrollPage(i));
        if (prevH > 0 && savedTop > 0) {
          requestAnimationFrame(() => {
            reader.scrollTop = (savedTop / prevH) * reader.scrollHeight;
          });
        }
      } else {
        for (let i = 0; i < total; i++) {
          const img = scrollView.children[i]?.querySelector('img');
          if (img && img.src !== pages[i].url) img.src = pages[i].url;
        }
      }
    }

    function addThumb(index) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'thumb-item';
      const img = document.createElement('img');
      img.loading = 'lazy'; img.decoding = 'async';
      img.src = pages[index].url; img.alt = pages[index].name;
      btn.appendChild(img);
      btn.addEventListener('click', () => {
        currentIndex = index; updateView(); syncScrollToCurrent();
      });
      thumbPanel.appendChild(btn);
    }

    function renderThumbs() {
      if (!pages.length) { thumbPanel.innerHTML = ''; return; }
      const existing = thumbPanel.childElementCount;
      if (existing > pages.length) {
        thumbPanel.innerHTML = '';
        for (let i = 0; i < pages.length; i++) addThumb(i);
      } else {
        for (let i = existing; i < pages.length; i++) addThumb(i);
      }
      updateThumbActive();
    }

    function updateThumbActive() {
      thumbPanel.querySelectorAll('.thumb-item').forEach((el, i) =>
        el.classList.toggle('active', i === currentIndex));
    }

    function renderBook() {
      const total = pages.length; if (!total) return;
      if (isSpreadView()) {
        normalizeSpreadIndex();
        const li = currentIndex, ri = li + 1, rOk = ri < total;
        pageCounter.textContent = rOk ? `${li+1}–${ri+1} / ${total}` : `${li+1} / ${total}`;
        leftPage.src  = pages[li]?.url || '';  leftPage.alt  = pages[li]?.name || '';
        rightPage.src = rOk ? pages[ri].url : ''; rightPage.alt = rOk ? pages[ri].name : '';
        rightPage.parentElement.style.visibility = rOk ? 'visible' : 'hidden';
      } else {
        pageCounter.textContent = `${currentIndex+1} / ${total}`;
        singlePage.src = pages[currentIndex]?.url || '';
        singlePage.alt = pages[currentIndex]?.name || '';
      }
    }

    function updateView() {
      if (!pages.length) {
        reader.classList.add('scroll');
        scrollView.classList.add('hidden'); bookShell.classList.add('hidden');
        dropzone.classList.remove('hidden');
        updateButtons(); updateThumbActive(); return;
      }
      dropzone.classList.add('hidden');
      const showScroll = mode === 'scroll';
      reader.classList.toggle('scroll', showScroll);
      scrollView.classList.toggle('hidden', !showScroll);
      bookShell.classList.toggle('hidden',   showScroll);
      if (showScroll) renderScroll(); else renderBook();
      updateButtons(); updateThumbActive();
    }

    /* ── Navigation ──────────────────────────────────────────────────── */
    function nextPage() {
      if (!pages.length || busy) return;
      const max = getMaxStartIndex();
      if (currentIndex >= max) return;
      currentIndex = Math.min(currentIndex + (mode === 'book' ? getBookStep() : 1), max);
      updateView(); syncScrollToCurrent();
      saveLastPosition();
    }
    function prevPage() {
      if (!pages.length || busy) return;
      if (currentIndex <= 0) return;
      currentIndex = Math.max(0, currentIndex - (mode === 'book' ? getBookStep() : 1));
      if (isSpreadView()) normalizeSpreadIndex();
      updateView(); syncScrollToCurrent();
      saveLastPosition();
    }
    function firstPage() {
      currentIndex = 0; updateView(); syncScrollToCurrent(); saveLastPosition();
    }
    function lastPage() {
      currentIndex = getMaxStartIndex();
      if (isSpreadView()) normalizeSpreadIndex();
      updateView(); syncScrollToCurrent(); saveLastPosition();
    }
    function syncScrollToCurrent() {
      if (mode !== 'scroll') return;
      scrollView.children[currentIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Fullscreen ──────────────────────────────────────────────────── */
    async function toggleFullscreen() {
      try {
        if (isIOS() || !document.documentElement.requestFullscreen) {
          document.body.classList.toggle('fullscreen-reading'); return;
        }
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          document.body.classList.add('fullscreen-reading');
        } else {
          await document.exitFullscreen();
          document.body.classList.remove('fullscreen-reading');
        }
      } catch(e) {
        document.body.classList.toggle('fullscreen-reading');
      }
    }
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('fullscreen-reading', !!document.fullscreenElement);
    });

    /* ── Event Listeners ─────────────────────────────────────────────── */
    openFileBtn.addEventListener('click',  () => fileInput.click());
    fileInput.addEventListener('change',   async (e) => { await loadSelectedFiles(e.target.files); e.target.value = ''; });
    dropzone.addEventListener('dragover',  (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop',      async (e) => {
      e.preventDefault(); dropzone.classList.remove('dragover');
      await loadSelectedFiles(e.dataTransfer.files);
    });

    btnMobile.addEventListener('click', () => setTheme('mobile'));
    btnPc.addEventListener('click',     () => setTheme('pc'));
    btnScroll.addEventListener('click', () => setMode('scroll'));
    btnBook.addEventListener('click',   () => setMode('book'));
    thumbToggleBtn.addEventListener('click', toggleThumbs);
    fsThumbBtn.addEventListener('click',     toggleThumbs);

    zoomOutBtn.addEventListener('click',   zoomOut);
    zoomInBtn.addEventListener('click',    zoomIn);
    zoomResetBtn.addEventListener('click', resetZoom);
    fsZoomOutBtn.addEventListener('click',   zoomOut);
    fsZoomInBtn.addEventListener('click',    zoomIn);
    fsZoomResetBtn.addEventListener('click', resetZoom);

    invertBtn.addEventListener('click',   toggleInvert);
    fsInvertBtn.addEventListener('click', toggleInvert);

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fsExitBtn.addEventListener('click',     toggleFullscreen);

    prevBtn.addEventListener('click',  prevPage);
    nextBtn.addEventListener('click',  nextPage);
    firstBtn.addEventListener('click', firstPage);
    lastBtn.addEventListener('click',  lastPage);
    bookPrev.addEventListener('click', prevPage);
    bookNext.addEventListener('click', nextPage);

    window.addEventListener('keydown', (e) => {
      if (!pages.length) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
      if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   prevPage();
      if (e.key === 'Home') firstPage();
      if (e.key === 'End')  lastPage();
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
      if (e.key.toLowerCase() === 'i') toggleInvert();
      if (e.key === '+' || e.key === '=') zoomIn();
      if (e.key === '-' || e.key === '_') zoomOut();
      if (e.key === '0') resetZoom();
    });

    /* ── Book mode swipe ─────────────────────────────────────────────── */
    let touchStartX = 0, touchStartY = 0;
    reader.addEventListener('touchstart', (e) => {
      if (!pages.length || mode !== 'book' || e.touches.length !== 1 || pinchActive) return;
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    }, { passive: true });
    reader.addEventListener('touchend', (e) => {
      if (!pages.length || mode !== 'book' || pinchActive) return;
      const t = e.changedTouches[0]; if (!t) return;
      const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dy) < 35) { dx < 0 ? nextPage() : prevPage(); }
    }, { passive: true });

    /* ── Init ────────────────────────────────────────────────────────── */
    updateOrientationState();
    applyPageZoom();
    applyInvert();
    setTheme(theme);
    setMode(mode);
    setThumbsOpen(thumbsOpen);
    updateView();
    updateGotoUI();

    let resizeRaf = null;
    window.addEventListener('resize', () => {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => {
        updateOrientationState(); updateView(); resizeRaf = null;
      });
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => { updateOrientationState(); updateView(); }, 100);
    });

    // บันทึกตำแหน่งก่อนปิด tab
    window.addEventListener('pagehide',     saveLastPosition);
    window.addEventListener('beforeunload', saveLastPosition);
  </script>
</body>
</html>
