<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CBZ Reader Local</title>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --accent: #5aa9ff;
      --border: #2a3140;
      --shadow: rgba(0,0,0,.35);
      --reader-bg: #111318;
      --page-bg: #ffffff;
      --thumb-w: 112px;
      --topbar-h: 62px;
      --zoom: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    body.mobile { --reader-bg: #0b0d12; }
    body.pc { --reader-bg: #131722; }
    body.portrait { --layout-mode: portrait; }
    body.landscape { --layout-mode: landscape; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* iOS: ใช้ dynamic viewport height หลีกเลี่ยง address bar ทับ */
      width: 100%;
      position: relative;
    }

    .topbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
      z-index: 30;
      min-height: var(--topbar-h);
    }

    .topbar .group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    input[type="file"] {
      background: #202635;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button.active {
      background: var(--accent);
      color: #05101c;
      border-color: transparent;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 44vw;
    }

    .dropzone {
      margin: 10px;
      padding: 16px;
      border: 2px dashed var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.02);
      color: var(--muted);
      text-align: center;
      user-select: none;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(90,169,255,.08);
    }

    .reader {
      flex: 1;
      overflow: hidden;
      background: var(--reader-bg);
      position: relative;
      touch-action: pan-y pan-x;
      /* FIX: ป้องกัน bounce effect บน iOS ที่ทำให้ zoom กระตุก */
      overscroll-behavior: contain;
    }

    .reader.scroll {
      overflow: auto;
    }

    /* FIX: ตอนกำลัง pinch ให้ปิด native touch gesture ทั้งหมด
       ป้องกัน iOS native zoom แทรกกลางการ zoom ของเรา */
    .reader.pinching {
      touch-action: none;
    }

    /* Continuous strip / webtoon-like scroll */
    .scroll-view {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 0;
      margin: 0;
    }

    .scroll-page {
      width: 100%;
      display: block;
      line-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .scroll-page img {
      display: block;
      width: calc(100% * var(--zoom));
      max-width: none;
      height: auto;
      margin: 0 auto;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: #fff;
      transform: none;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .book-shell {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .book {
      position: relative;
      width: min(92vw, 1200px);
      height: min(88vh, 900px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .spread {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .page {
      position: relative;
      background: var(--page-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #fff;
    }

    .single-page {
      width: 100%;
      height: 100%;
      display: none;
    }

    .single-page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 12px 40px var(--shadow);
      border-radius: 12px;
    }

    .nav-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      z-index: 12;
    }

    .nav-bottom .navbtn {
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }

    .page-counter {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,.55);
      color: white;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 13;
      pointer-events: none;
    }

    .hidden { display: none !important; }

    .thumb-panel {
      position: fixed;
      top: var(--topbar-h);
      right: 0;
      width: var(--thumb-w);
      height: calc(100vh - var(--topbar-h));
      background: rgba(12, 14, 20, .96);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform .18s ease;
      z-index: 28;
      overflow-y: auto;
      padding: 8px;
      box-shadow: -8px 0 24px rgba(0,0,0,.22);
    }

    body.fullscreen-reading .thumb-panel {
      top: 0;
      height: 100vh;
      height: 100dvh;
    }

    body.thumbs-open .thumb-panel {
      transform: translateX(0);
    }

    .thumb-item {
      width: 100%;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
      background: #1b2130;
      line-height: 0;
    }

    .thumb-item.active {
      border-color: var(--accent);
    }

    .thumb-item img {
      width: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 3 / 4;
      background: #fff;
    }

    .fullscreen-tools {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: none;
      gap: 8px;
      z-index: 40;
    }

    body.fullscreen-reading .fullscreen-tools {
      display: flex;
    }

    :fullscreen .topbar,
    body.fullscreen-reading .topbar {
      display: none !important;
    }

    :fullscreen .dropzone,
    body.fullscreen-reading .dropzone {
      display: none !important;
    }

    :fullscreen .reader,
    body.fullscreen-reading .reader {
      height: 100vh !important;
      height: 100dvh !important;
    }

    /* FIX: เมื่อ fullscreen ให้ app เต็มจอด้วย dvh */
    body.fullscreen-reading .app {
      height: 100vh;
      height: 100dvh;
    }

    body.mobile .book {
      width: min(100vw, 100%);
      height: calc(100vh - var(--topbar-h));
    }

    body.fullscreen-reading .book {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    body.mobile.portrait .spread {
      display: none;
    }

    body.mobile.portrait .single-page {
      display: block;
    }

    body.mobile.landscape .spread {
      display: grid;
    }

    body.mobile.landscape .single-page {
      display: none;
    }

    body.pc .spread {
      display: grid;
    }

    body.pc .single-page {
      display: none;
    }

    body.pc .book {
      width: min(96vw, 1400px);
      height: min(90vh, 980px);
    }

    @media (max-width: 900px) {
      .status {
        max-width: 100%;
        margin-left: 0;
      }
    }

    @media (max-width: 700px) {
      :root { --thumb-w: 96px; }
      .topbar {
        gap: 6px;
      }
      button, input[type="file"] {
        padding: 9px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body class="mobile portrait">
  <div class="app">
    <div class="topbar">
      <div class="group">
        <input id="fileInput" type="file" multiple />
        <button id="openFileBtn">Open</button>
        <button id="btnMobile" class="active">Mobile</button>
        <button id="btnPc">PC</button>
        <button id="btnScroll" class="active">Scroll</button>
        <button id="btnBook">Book</button>
        <button id="thumbToggleBtn">Thumbs</button>
        <button id="zoomOutBtn">－</button>
        <button id="zoomResetBtn">100%</button>
        <button id="zoomInBtn">＋</button>
        <button id="fullscreenBtn">Fullscreen</button>
      </div>

      <div class="group">
        <button id="prevBtn" disabled>Prev</button>
        <button id="nextBtn" disabled>Next</button>
        <button id="firstBtn" disabled>First</button>
        <button id="lastBtn" disabled>Last</button>
      </div>

      <div class="status" id="status">เลือกไฟล์ CBZ/ZIP หรือรูปภาพ</div>
    </div>

    <div id="dropzone" class="dropzone">ลากไฟล์ .cbz, .zip หรือรูปภาพมาวางตรงนี้</div>

    <div id="reader" class="reader scroll">
      <div id="scrollView" class="scroll-view hidden"></div>

      <div id="bookShell" class="book-shell hidden">
        <div class="book">
          <div class="page-counter" id="pageCounter">0 / 0</div>

          <div class="spread">
            <div class="page"><img id="leftPage" alt="left page"></div>
            <div class="page"><img id="rightPage" alt="right page"></div>
          </div>

          <div class="single-page">
            <img id="singlePage" alt="single page">
          </div>

          <div class="nav-bottom">
            <button class="navbtn" id="bookPrev">◀</button>
            <button class="navbtn" id="bookNext">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="thumbPanel" class="thumb-panel hidden"></div>

  <div class="fullscreen-tools">
    <button id="fsThumbBtn">Thumbs</button>
    <button id="fsZoomOutBtn">－</button>
    <button id="fsZoomResetBtn">100%</button>
    <button id="fsZoomInBtn">＋</button>
    <button id="fsExitBtn">Exit</button>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const openFileBtn = document.getElementById('openFileBtn');
    const dropzone = document.getElementById('dropzone');
    const reader = document.getElementById('reader');
    const scrollView = document.getElementById('scrollView');
    const bookShell = document.getElementById('bookShell');
    const statusEl = document.getElementById('status');
    const btnMobile = document.getElementById('btnMobile');
    const btnPc = document.getElementById('btnPc');
    const btnScroll = document.getElementById('btnScroll');
    const btnBook = document.getElementById('btnBook');
    const thumbToggleBtn = document.getElementById('thumbToggleBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsThumbBtn = document.getElementById('fsThumbBtn');
    const fsZoomOutBtn = document.getElementById('fsZoomOutBtn');
    const fsZoomResetBtn = document.getElementById('fsZoomResetBtn');
    const fsZoomInBtn = document.getElementById('fsZoomInBtn');
    const fsExitBtn = document.getElementById('fsExitBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const firstBtn = document.getElementById('firstBtn');
    const lastBtn = document.getElementById('lastBtn');
    const bookPrev = document.getElementById('bookPrev');
    const bookNext = document.getElementById('bookNext');
    const leftPage = document.getElementById('leftPage');
    const rightPage = document.getElementById('rightPage');
    const singlePage = document.getElementById('singlePage');
    const pageCounter = document.getElementById('pageCounter');
    const thumbPanel = document.getElementById('thumbPanel');

    let pages = [];
    let currentIndex = 0;
    let theme = localStorage.getItem('cbz_theme') || 'mobile';
    let mode = localStorage.getItem('cbz_mode') || 'scroll';
    let thumbsOpen = localStorage.getItem('cbz_thumbs');
    let zoomLevel = Number(localStorage.getItem('cbz_zoom') || '1');
    let zoomLocked = localStorage.getItem('cbz_zoom_locked') === '1';
    let busy = false;

    if (thumbsOpen === null) thumbsOpen = (theme === 'pc') ? '1' : '0';
    thumbsOpen = thumbsOpen === '1';

    // ─── FIX 1: iOS detection ──────────────────────────────────────────────────
    // iOS ไม่รองรับ requestFullscreen() บน webpage ปกติ
    // การเรียก API นี้ทำให้ iOS คิดว่ากำลัง interact กับ form แล้วแสดง dialog เด้งออก
    function isIOS() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        // iPad บน iOS 13+ แสดงตัวเป็น Mac จึงเช็ค maxTouchPoints เพิ่มเติม
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      );
    }

    function setStatus(msg) { statusEl.textContent = msg; }
    function isImageFile(name) { return /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(name); }
    function isZipFile(name) { return /\.(cbz|zip)$/i.test(name); }
    function naturalSort(a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }); }
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function updateOrientationState() {
      const portrait = window.matchMedia('(orientation: portrait)').matches || window.innerHeight >= window.innerWidth;
      document.body.classList.toggle('portrait', portrait);
      document.body.classList.toggle('landscape', !portrait);
    }

    function isSpreadView() {
      return mode === 'book' && (theme === 'pc' || document.body.classList.contains('landscape'));
    }

    function getBookStep() { return isSpreadView() ? 2 : 1; }

    function getMaxStartIndex() {
      if (!pages.length) return 0;
      if (!isSpreadView()) return pages.length - 1;
      if (pages.length <= 1) return 0;
      return (pages.length % 2 === 0) ? pages.length - 2 : pages.length - 1;
    }

    function normalizeSpreadIndex() {
      if (!isSpreadView()) return;
      if (currentIndex % 2 === 1) currentIndex -= 1;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex > getMaxStartIndex()) currentIndex = getMaxStartIndex();
    }

    function applyZoom() {
      zoomLevel = clamp(zoomLevel, 0.5, 3);
      document.documentElement.style.setProperty('--zoom', zoomLevel);
      localStorage.setItem('cbz_zoom', String(zoomLevel));
      localStorage.setItem('cbz_zoom_locked', zoomLocked ? '1' : '0');
      const pct = Math.round(zoomLevel * 100);
      zoomResetBtn.textContent = `${pct}%`;
      fsZoomResetBtn.textContent = `${pct}%`;
    }

    // ─── FIX 2: Zoom shake ─────────────────────────────────────────────────────
    // ปัญหาเดิม: applyZoom() เปลี่ยนขนาด CSS var ทำให้ layout reflow
    // แต่เรา set scrollLeft/scrollTop ก่อน browser จะ reflow เสร็จ
    // ผลคือ scroll position กระตุก/หลุดไปที่อื่น
    // แก้: ใช้ requestAnimationFrame รอให้ browser วาด frame ใหม่ก่อน
    // แล้วค่อย set scroll position หลัง layout อัพเดทแล้ว
    function zoomAtPoint(nextZoom, clientX, clientY, userAction = true) {
      const oldZoom = zoomLevel;
      const newZoom = clamp(Number(nextZoom) || 1, 0.5, 3);
      if (Math.abs(newZoom - oldZoom) < 0.0001) return;

      const rect = reader.getBoundingClientRect();
      const x = clamp(clientX - rect.left, 0, rect.width);
      const y = clamp(clientY - rect.top, 0, rect.height);
      const scaleFactor = newZoom / oldZoom;

      if (mode === 'scroll') {
        // คำนวณ scroll position ที่ต้องการ ก่อน apply zoom
        // เพื่อให้ content ใต้จุดที่ zoom อยู่ที่เดิมหลัง zoom
        const nextScrollLeft = (reader.scrollLeft + x) * scaleFactor - x;
        const nextScrollTop  = (reader.scrollTop  + y) * scaleFactor - y;

        zoomLevel = newZoom;
        if (userAction) {
          zoomLocked = true;
          lastZoomInteraction = Date.now();
          suppressFullscreenTapUntil = Date.now() + 700;
        }
        applyZoom(); // ← CSS var เปลี่ยน → browser จะ reflow ใน frame ถัดไป

        // รอ 1 frame หลัง layout เสร็จแล้วค่อย restore scroll position
        requestAnimationFrame(() => {
          reader.scrollLeft = Math.max(0, nextScrollLeft);
          reader.scrollTop  = Math.max(0, nextScrollTop);
          updateThumbActive();
        });
        return;
      }

      zoomLevel = newZoom;
      if (userAction) {
        zoomLocked = true;
        lastZoomInteraction = Date.now();
        suppressFullscreenTapUntil = Date.now() + 700;
      }
      applyZoom();
      updateView();
    }
    function pinchZoom(nextZoom) {
      const oldZoom = zoomLevel;
      const newZoom = clamp(nextZoom, 0.5, 3);
    
      if (Math.abs(newZoom - oldZoom) < 0.0001) return;
    
      const scaleFactor = newZoom / oldZoom;
    
      zoomLevel = newZoom;
      applyZoom();
    
      requestAnimationFrame(() => {
    
        reader.scrollLeft =
          (pinchStartScrollLeft + pinchStartRelX) *
          scaleFactor -
          pinchStartRelX;
    
        reader.scrollTop =
          (pinchStartScrollTop + pinchStartRelY) *
          scaleFactor -
          pinchStartRelY;
    
      });
    }

    function setZoom(nextZoom, userAction = true) {
      const rect = reader.getBoundingClientRect();
      zoomAtPoint(nextZoom, rect.width / 2, rect.height / 2, userAction);
    }

    function zoomIn() { setZoom(zoomLevel + 0.1, true); }
    function zoomOut() { setZoom(zoomLevel - 0.1, true); }

    function resetZoom(lockOff = true) {
      zoomLevel = 1;
      zoomLocked = !lockOff ? zoomLocked : false;
      lastZoomInteraction = Date.now();
      suppressFullscreenTapUntil = Date.now() + 700;
      applyZoom();
      if (lockOff) localStorage.removeItem('cbz_zoom_locked');
      updateView();
    }

    function autoFitZoom() {
      if (zoomLocked) return;
      if (theme === 'mobile' && mode === 'scroll') {
        const portrait = document.body.classList.contains('portrait');
        zoomLevel = portrait ? 1 : 0.84;
        applyZoom();
        return;
      }
      zoomLevel = 1;
      applyZoom();
    }

    function setTheme(t) {
      theme = t;
      localStorage.setItem('cbz_theme', t);
      document.body.classList.toggle('mobile', t === 'mobile');
      document.body.classList.toggle('pc', t === 'pc');
      btnMobile.classList.toggle('active', t === 'mobile');
      btnPc.classList.toggle('active', t === 'pc');
      if (theme === 'pc') setThumbsOpen(true);
      if (!zoomLocked) autoFitZoom();
      updateView();
    }

    function setMode(m) {
      mode = m;
      localStorage.setItem('cbz_mode', m);
      btnScroll.classList.toggle('active', m === 'scroll');
      btnBook.classList.toggle('active', m === 'book');
      if (!zoomLocked) autoFitZoom();
      updateView();
    }

    function setThumbsOpen(open) {
      thumbsOpen = !!open;
      localStorage.setItem('cbz_thumbs', thumbsOpen ? '1' : '0');
      document.body.classList.toggle('thumbs-open', thumbsOpen);
      thumbPanel.classList.toggle('hidden', !thumbsOpen);
      thumbToggleBtn.classList.toggle('active', thumbsOpen);
      fsThumbBtn.classList.toggle('active', thumbsOpen);
    }

    function toggleThumbs() { setThumbsOpen(!thumbsOpen); }

    function clearPages() {
      for (const p of pages) {
        try { URL.revokeObjectURL(p.url); } catch {}
      }
      pages = [];
      currentIndex = 0;
      scrollView.innerHTML = '';
      thumbPanel.innerHTML = '';
      leftPage.src = '';
      rightPage.src = '';
      singlePage.src = '';
      pageCounter.textContent = '0 / 0';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      firstBtn.disabled = true;
      lastBtn.disabled = true;
      bookPrev.disabled = true;
      bookNext.disabled = true;
      dropzone.classList.remove('hidden');
    }

    async function loadImageFiles(fileList) {
      clearPages();
      setStatus('กำลังอ่านรูปภาพ...');
      const files = [...fileList].filter(f => isImageFile(f.name)).sort((a, b) => naturalSort(a.name, b.name));
      if (!files.length) {
        setStatus('ไม่พบรูปภาพ');
        return;
      }
      for (const file of files) {
        const url = URL.createObjectURL(file);
        pages.push({ name: file.name, url });
      }
      currentIndex = 0;
      setStatus(`โหลดแล้ว ${pages.length} หน้า`);
      renderThumbs();
      updateView();
    }

    async function loadCbz(file) {
      if (!window.JSZip) {
        alert('JSZip โหลดไม่สำเร็จ');
        return;
      }
      clearPages();
      setStatus('กำลังอ่านไฟล์...');
      const zip = await JSZip.loadAsync(file);
      const entries = [];
      zip.forEach((relativePath, zipEntry) => {
        if (!zipEntry.dir && isImageFile(zipEntry.name)) entries.push(zipEntry.name);
      });
      entries.sort(naturalSort);
      if (!entries.length) {
        setStatus('ไม่พบรูปในไฟล์ CBZ');
        return;
      }
      for (const name of entries) {
        const blob = await zip.file(name).async('blob');
        const url = URL.createObjectURL(blob);
        pages.push({ name, url });
      }
      currentIndex = 0;
      setStatus(`โหลดแล้ว ${pages.length} หน้า`);
      renderThumbs();
      updateView();
    }

    async function loadSelectedFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;
      const first = files[0];
      try {
        if (files.length > 1 || isImageFile(first.name)) {
          await loadImageFiles(files);
        } else if (isZipFile(first.name)) {
          await loadCbz(first);
        } else {
          setStatus('รองรับ .cbz, .zip และไฟล์รูปภาพ');
        }
      } catch (err) {
        console.error(err);
        clearPages();
        setStatus('เปิดไฟล์ไม่สำเร็จ: ' + (err?.message || err));
      }
    }

    function updateButtons() {
      const has = pages.length > 0;
      const lastStart = getMaxStartIndex();
      prevBtn.disabled = !has || currentIndex <= 0;
      firstBtn.disabled = !has || currentIndex <= 0;
      nextBtn.disabled = !has || currentIndex >= lastStart;
      lastBtn.disabled = !has || currentIndex >= lastStart;
      bookPrev.disabled = !has || currentIndex <= 0;
      bookNext.disabled = !has || currentIndex >= lastStart;
    }

    function renderScroll() {
      if (scrollView.childElementCount !== pages.length) {
        scrollView.innerHTML = '';
        for (let i = 0; i < pages.length; i++) {
          const wrap = document.createElement('div');
          wrap.className = 'scroll-page';
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.decoding = 'async';
          img.src = pages[i].url;
          img.alt = pages[i].name;
          wrap.appendChild(img);
          scrollView.appendChild(wrap);
        }
      }
    }

    function renderThumbs() {
      if (!pages.length) {
        thumbPanel.innerHTML = '';
        return;
      }
      if (thumbPanel.childElementCount !== pages.length) {
        thumbPanel.innerHTML = '';
        pages.forEach((page, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb-item';
          btn.dataset.index = String(index);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.decoding = 'async';
          img.src = page.url;
          img.alt = page.name;
          btn.appendChild(img);
          btn.addEventListener('click', () => {
            currentIndex = index;
            updateView();
            syncScrollToCurrent();
          });
          thumbPanel.appendChild(btn);
        });
      }
      updateThumbActive();
    }

    function updateThumbActive() {
      const items = thumbPanel.querySelectorAll('.thumb-item');
      items.forEach((el, i) => el.classList.toggle('active', i === currentIndex));
    }

    function renderBook() {
      const total = pages.length;
      if (!total) return;
      if (isSpreadView()) {
        normalizeSpreadIndex();
        const leftIndex = currentIndex;
        const rightIndex = currentIndex + 1;
        const rightExists = rightIndex < total;
        pageCounter.textContent = rightExists ? `${leftIndex + 1}-${rightIndex + 1} / ${total}` : `${leftIndex + 1} / ${total}`;
        leftPage.src = pages[leftIndex]?.url || '';
        leftPage.alt = pages[leftIndex]?.name || '';
        rightPage.src = rightExists ? (pages[rightIndex]?.url || '') : '';
        rightPage.alt = rightExists ? (pages[rightIndex]?.name || '') : '';
        rightPage.parentElement.style.visibility = rightExists ? 'visible' : 'hidden';
      } else {
        pageCounter.textContent = `${currentIndex + 1} / ${total}`;
        singlePage.src = pages[currentIndex]?.url || '';
        singlePage.alt = pages[currentIndex]?.name || '';
      }
    }

    function updateView() {
      if (!pages.length) {
        reader.classList.add('scroll');
        scrollView.classList.add('hidden');
        bookShell.classList.add('hidden');
        dropzone.classList.remove('hidden');
        updateButtons();
        updateThumbActive();
        return;
      }

      dropzone.classList.add('hidden');
      const showScroll = mode === 'scroll';
      reader.classList.toggle('scroll', showScroll);
      scrollView.classList.toggle('hidden', !showScroll);
      bookShell.classList.toggle('hidden', showScroll);

      if (showScroll) {
        renderScroll();
      } else {
        renderBook();
      }

      updateButtons();
      updateThumbActive();
    }

    function nextPage() {
      if (!pages.length || busy) return;
      const step = mode === 'book' ? getBookStep() : 1;
      const maxStart = getMaxStartIndex();
      if (currentIndex >= maxStart) return;
      currentIndex = Math.min(currentIndex + step, maxStart);
      updateView();
      syncScrollToCurrent();
    }

    function prevPage() {
      if (!pages.length || busy) return;
      const step = mode === 'book' ? getBookStep() : 1;
      if (currentIndex <= 0) return;
      currentIndex = Math.max(0, currentIndex - step);
      if (isSpreadView()) normalizeSpreadIndex();
      updateView();
      syncScrollToCurrent();
    }

    function firstPage() {
      currentIndex = 0;
      updateView();
      syncScrollToCurrent();
    }

    function lastPage() {
      currentIndex = getMaxStartIndex();
      if (isSpreadView()) normalizeSpreadIndex();
      updateView();
      syncScrollToCurrent();
    }

    function syncScrollToCurrent() {
      if (mode !== 'scroll') return;
      const target = scrollView.children[currentIndex];
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ─── FIX 1 (ต่อ): toggleFullscreen สำหรับ iOS ────────────────────────────
    // iOS Safari ไม่รองรับ requestFullscreen() บน webpage ปกติ
    // เมื่อเรียก API นี้ iOS จะแสดง dialog ว่า "คุณกำลังกรอกข้อมูล" แล้วออก
    // แก้: บน iOS ใช้ CSS class toggle เท่านั้น ไม่เรียก API เลย
    async function toggleFullscreen() {
      const ios = isIOS();
      const hasApi = !!document.documentElement.requestFullscreen;

      if (ios || !hasApi) {
        // CSS-only fullscreen สำหรับ iOS และ browser ที่ไม่รองรับ API
        document.body.classList.toggle('fullscreen-reading');
        return;
      }

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          document.body.classList.add('fullscreen-reading');
        } else {
          await document.exitFullscreen();
          document.body.classList.remove('fullscreen-reading');
        }
      } catch (e) {
        // Fallback: ถ้า API ล้มเหลว ใช้ CSS class แทน
        console.error('Fullscreen API error:', e);
        document.body.classList.toggle('fullscreen-reading');
      }
    }

    function onFullscreenChanged() {
      document.body.classList.toggle('fullscreen-reading', !!document.fullscreenElement);
    }

    function zoomFromCenter(nextZoom, userAction = true) {
      const rect = reader.getBoundingClientRect();
      zoomAtPoint(nextZoom, rect.width / 2, rect.height / 2, userAction);
    }

    // events
    openFileBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      await loadSelectedFiles(e.target.files);
      e.target.value = '';
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      await loadSelectedFiles(e.dataTransfer.files);
    });

    btnMobile.addEventListener('click', () => setTheme('mobile'));
    btnPc.addEventListener('click', () => setTheme('pc'));
    btnScroll.addEventListener('click', () => setMode('scroll'));
    btnBook.addEventListener('click', () => setMode('book'));
    thumbToggleBtn.addEventListener('click', toggleThumbs);
    fsThumbBtn.addEventListener('click', toggleThumbs);
    zoomOutBtn.addEventListener('click', () => zoomFromCenter(zoomLevel - 0.1, true));
    zoomResetBtn.addEventListener('click', () => { zoomLocked = false; resetZoom(true); });
    zoomInBtn.addEventListener('click', () => zoomFromCenter(zoomLevel + 0.1, true));
    fsZoomOutBtn.addEventListener('click', () => zoomFromCenter(zoomLevel - 0.1, true));
    fsZoomResetBtn.addEventListener('click', () => { zoomLocked = false; resetZoom(true); });
    fsZoomInBtn.addEventListener('click', () => zoomFromCenter(zoomLevel + 0.1, true));
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fsExitBtn.addEventListener('click', toggleFullscreen);

    prevBtn.addEventListener('click', prevPage);
    nextBtn.addEventListener('click', nextPage);
    firstBtn.addEventListener('click', firstPage);
    lastBtn.addEventListener('click', lastPage);
    bookPrev.addEventListener('click', prevPage);
    bookNext.addEventListener('click', nextPage);

    window.addEventListener('keydown', (e) => {
      if (!pages.length) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
      if (e.key === 'Home') firstPage();
      if (e.key === 'End') lastPage();
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
      if (e.key === '+' || e.key === '=') zoomFromCenter(zoomLevel + 0.1, true);
      if (e.key === '-' || e.key === '_') zoomFromCenter(zoomLevel - 0.1, true);
      if (e.key === '0') { zoomLocked = false; resetZoom(true); }
    });

    document.addEventListener('fullscreenchange', onFullscreenChanged);

    reader.addEventListener('dblclick', () => {
      if (!pages.length) return;
      if (Date.now() < suppressFullscreenTapUntil) return;
      if (Math.abs(zoomLevel - 1) > 0.001) {
        zoomLocked = false;
        resetZoom(true);
      }
    });

    // Swipe and pinch
    let touchStartX = 0;
    let touchStartY = 0;
    let tapLastTime = 0;
    let pinchStartDistance = 0;
    let pinchStartZoom = 1;
    let pinchActive = false;
    let lastZoomInteraction = 0;
    let suppressFullscreenTapUntil = 0;

    // ─── FIX (pinch drift): state ที่เซฟตอนเริ่ม pinch ──────────────────────
    // ปัญหาเดิม: touchmove ทุก frame อ่าน reader.scrollLeft เพื่อคำนวณ scroll ใหม่
    // แต่เราใช้ rAF เลื่อน scroll update → frame ถัดไปอ่านค่าเก่า (stale) เสมอ
    // สะสมทุก frame → scroll หลุดไปข้าง
    // แก้: เซฟ scroll + จุด pinch ตอนเริ่ม pinch ครั้งเดียว
    // ทุก frame คำนวณ target จาก baseline นั้นโดยตรง ไม่อ่าน scrollLeft อีก
    let pinchStartScrollLeft = 0;
    let pinchStartScrollTop  = 0;
    let pinchStartRelX = 0; // จุดกึ่งกลางนิ้วสองนิ้วตอนเริ่ม relative to reader
    let pinchStartRelY = 0;
    let pinchRafId = null;  // เก็บ rAF id เพื่อ cancel frame เก่าก่อน queue ใหม่

    // ─── FIX 2+3: touchstart ───────────────────────────────────────────────────
    // เปลี่ยน passive: true → passive: false เพื่อให้เรียก preventDefault() ได้
    // สำหรับ 2-finger touch → preventDefault() ป้องกัน iOS native pinch-zoom
    // เพิ่ม reader.classList.add('pinching') → CSS ปิด touch-action native ระหว่าง pinch
    reader.addEventListener('touchstart', (e) => {
      if (!pages.length) return;
      if (e.touches.length === 2) {
        e.preventDefault(); // ป้องกัน iOS จาก native zoom gesture
        reader.classList.add('pinching');
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDistance = Math.hypot(dx, dy);
        pinchStartZoom = zoomLevel;

        // เซฟ scroll และจุดกึ่งกลาง ณ จุดเริ่มต้น pinch
        // ใช้เป็น baseline คงที่สำหรับการคำนวณทุก frame
        const rect = reader.getBoundingClientRect();
        pinchZoom(
          pinchStartZoom * ratio
        );

        pinchActive = true;
        lastZoomInteraction = Date.now();
        suppressFullscreenTapUntil = Date.now() + 700;
        return;
      }
      const t = e.changedTouches[0];
      if (!t) return;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: false }); // ← เปลี่ยนเป็น passive: false เพื่อให้ preventDefault() ทำงาน

    reader.addEventListener('touchmove', (e) => {
      if (!pinchActive || e.touches.length !== 2) return;
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const distance = Math.hypot(dx, dy);
      if (!pinchStartDistance) return;
      const ratio = distance / pinchStartDistance;
      zoomLocked = true;
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomAtPoint(pinchStartZoom * ratio, midX, midY, true);
    }, { passive: false });

    // ─── FIX 3 (ต่อ): touchend ────────────────────────────────────────────────
    // ลบ 'pinching' class เสมอเมื่อ touch จบ เพื่อให้ scroll กลับมาทำงาน
    reader.addEventListener('touchend', (e) => {
      reader.classList.remove('pinching'); // ← คืน touch-action ปกติ
      if (!pages.length) return;
      if (e.touches && e.touches.length >= 2) return;
      if (pinchActive) {
        pinchActive = false;
        suppressFullscreenTapUntil = Date.now() + 700;
        return;
      }
      const now = Date.now();
      const t = e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dy) < 35 && mode === 'book') {
        if (dx < 0) nextPage();
        else prevPage();
        return;
      }
      if (Date.now() < suppressFullscreenTapUntil) {
        tapLastTime = now;
        return;
      }

      if (now - tapLastTime < 280) {
        if (Math.abs(zoomLevel - 1) > 0.001) {
          zoomLocked = false;
          resetZoom(true);
        }
        tapLastTime = 0;
      } else {
        tapLastTime = now;
      }
    }, { passive: true });

    // FIX: ลบ pinching class เมื่อ touch ถูก cancel (เช่น incoming call, notification)
    reader.addEventListener('touchcancel', () => {
      reader.classList.remove('pinching');
      pinchActive = false;
    }, { passive: true });

    reader.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      zoomLocked = true;
      lastZoomInteraction = Date.now();
      suppressFullscreenTapUntil = Date.now() + 700;
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      zoomFromCenter(zoomLevel + delta, true);
    }, { passive: false });

    // init
    updateOrientationState();
    applyZoom();
    setTheme(theme);
    setMode(mode);
    setThumbsOpen(thumbsOpen);
    if (!zoomLocked) autoFitZoom();
    else applyZoom();
    updateView();

    window.addEventListener('resize', () => {
      const before = document.body.classList.contains('portrait');
      updateOrientationState();
      const after = document.body.classList.contains('portrait');
      if (!zoomLocked) autoFitZoom();
      if (before !== after) updateView();
    });

    window.addEventListener('orientationchange', () => {
      updateOrientationState();
      if (!zoomLocked) autoFitZoom();
      updateView();
    });
  </script>
</body>
</html>
